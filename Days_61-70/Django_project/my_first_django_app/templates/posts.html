{% extends "base.html" %} 

{% block title %}Posts{% endblock %} 

{% block content %}
    <h1>Blog Posts</h1>
    {% for post in posts %}
    <div>
        <h2>{{ post.title }}</h2>
        <small>{{ post.created_at|date:"F d, Y" }}</small>
        <p>{{ post.content }}</p>
        <a href="{% url 'my_first_django_app:post' post.id %}" title="Read more">Read more</a>
        <!-- <a href="{% url 'my_first_django_app:posts' %}" title="Back to all posts">← Back to all posts</a> -->
    </div>
    {% empty %}
    <p>No posts available.</p>
    {% endfor %}
{% endblock %}
