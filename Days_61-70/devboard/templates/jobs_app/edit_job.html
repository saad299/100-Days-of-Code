{% extends 'base.html' %}

{% block title %}Edit Job{% endblock %}

{% block content %}
<h1>Edit: {{ job.title }}</h1>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Update Job</button>
  <a href="{% url 'jobs_app:employer_dashboard' %}">Cancel</a>
</form>
{% endblock %}
